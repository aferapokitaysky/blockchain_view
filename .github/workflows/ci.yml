name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  rust-api:
    name: Rust API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tracefold_test
          POSTGRES_USER: tracefold
          POSTGRES_PASSWORD: tracefold_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracefold -d tracefold_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tracefold:tracefold_test_only@localhost:5432/tracefold_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - run: cargo fmt --manifest-path apps/api/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path apps/api/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path apps/api/Cargo.toml --all-features
      - run: cargo build --release --locked -p tracefold-api --bins
