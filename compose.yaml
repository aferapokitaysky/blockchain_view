services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracefold}
      POSTGRES_USER: ${POSTGRES_USER:-tracefold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracefold_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-tracefold}:${POSTGRES_PASSWORD:-tracefold_dev_only}@postgres:5432/${POSTGRES_DB:-tracefold}
      REDIS_URL: redis://redis:6379
      BITCOIN_ESPLORA_URL: ${BITCOIN_ESPLORA_URL:-https://blockstream.info/api}
      BLOCKSCOUT_BASE_URL: ${BLOCKSCOUT_BASE_URL:-https://api.blockscout.com}
      BLOCKSCOUT_API_KEY: ${BLOCKSCOUT_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      ETHERSCAN_ENABLE_PAID_CHAINS: ${ETHERSCAN_ENABLE_PAID_CHAINS:-false}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet.solana.com}
      SOLANA_HELIUS_API_KEY: ${SOLANA_HELIUS_API_KEY:-}
      TRONGRID_BASE_URL: ${TRONGRID_BASE_URL:-https://api.trongrid.io}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      XRPL_RPC_URL: ${XRPL_RPC_URL:-https://s2.ripple.com:51234/}
      TONCENTER_BASE_URL: ${TONCENTER_BASE_URL:-https://toncenter.com/api/v3}
      TONCENTER_API_KEY: ${TONCENTER_API_KEY:-}
      BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID:-}
      APTOS_INDEXER_URL: ${APTOS_INDEXER_URL:-https://api.mainnet.aptoslabs.com/v1/graphql}
      APTOS_INDEXER_API_KEY: ${APTOS_INDEXER_API_KEY:-}
      SUI_GRAPHQL_URL: ${SUI_GRAPHQL_URL:-https://graphql.mainnet.sui.io/graphql}
      SUI_GRAPHQL_API_KEY: ${SUI_GRAPHQL_API_KEY:-}
      RUST_LOG: info
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sync-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["/usr/local/bin/sync_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tracefold}:${POSTGRES_PASSWORD:-tracefold_dev_only}@postgres:5432/${POSTGRES_DB:-tracefold}
      REDIS_URL: redis://redis:6379
      BITCOIN_ESPLORA_URL: ${BITCOIN_ESPLORA_URL:-https://blockstream.info/api}
      BLOCKSCOUT_BASE_URL: ${BLOCKSCOUT_BASE_URL:-https://api.blockscout.com}
      BLOCKSCOUT_API_KEY: ${BLOCKSCOUT_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      ETHERSCAN_ENABLE_PAID_CHAINS: ${ETHERSCAN_ENABLE_PAID_CHAINS:-false}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet.solana.com}
      SOLANA_HELIUS_API_KEY: ${SOLANA_HELIUS_API_KEY:-}
      TRONGRID_BASE_URL: ${TRONGRID_BASE_URL:-https://api.trongrid.io}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      XRPL_RPC_URL: ${XRPL_RPC_URL:-https://s2.ripple.com:51234/}
      TONCENTER_BASE_URL: ${TONCENTER_BASE_URL:-https://toncenter.com/api/v3}
      TONCENTER_API_KEY: ${TONCENTER_API_KEY:-}
      BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID:-}
      APTOS_INDEXER_URL: ${APTOS_INDEXER_URL:-https://api.mainnet.aptoslabs.com/v1/graphql}
      APTOS_INDEXER_API_KEY: ${APTOS_INDEXER_API_KEY:-}
      SUI_GRAPHQL_URL: ${SUI_GRAPHQL_URL:-https://graphql.mainnet.sui.io/graphql}
      SUI_GRAPHQL_API_KEY: ${SUI_GRAPHQL_API_KEY:-}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
